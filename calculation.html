<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Расчёт — ориентир</title><link rel="stylesheet" href="assets/css/fonts.css"><style>body{font:16px/1.5 Manrope,system-ui,sans-serif;margin:0;padding:2rem;color:#121212;background:#fff}main{max-width:760px;margin:auto}h1{font-family:Geologica,sans-serif}dl{display:grid;grid-template-columns:12rem 1fr;gap:.5rem 1rem}dt{color:#5c5a55}.note{padding:1rem;border:1px solid #121212}@media print{.noprint{display:none}}</style></head><body><main><h1>Ориентир по бюджету стенда</h1><p class="note"><b>Демонстрационная модель.</b> Это не коммерческое предложение и не смета ЦРВУ. Аренда площади, сборы организатора и площадки, подключения и техконтроль в расчёт не входят.</p><dl id="rows"></dl><p class="noprint"><button onclick="print()">Печать / сохранить в PDF</button></p></main><script>try{var d=JSON.parse(decodeURIComponent(location.hash.slice(1))),L={standard:'Стандарт',exclusive:'Эксклюзив',premium:'Премиум',linear:'Линейный',corner:'Угловой',peninsula:'Полуостров',island:'Остров'},f=function(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')},r=[['Площадь',String(d.S).replace('.',',')+' м²'],['Тип',L[d.type]],['Уровень',L[d.level]],['Дополнительно',(d.extras||[]).join(', ')||'нет'],['Ориентир',d.hi===null?'от '+f(d.lo)+' ₽, верхняя граница по проекту':f(d.lo)+' — '+f(d.hi)+' ₽']];if(d.floorArea)r.splice(4,0,['Площадь 2 этажа',String(d.floorArea).replace('.',',')+' м²']);if(d.ledCount)r.splice(4,0,['LED-экраны',d.ledCount]);document.getElementById('rows').innerHTML=r.map(function(x){return '<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>'}).join('')}catch(e){document.getElementById('rows').textContent='Нет данных расчёта.'}</script></body></html>
